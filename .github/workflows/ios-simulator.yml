name: iOS simulator build
on:
  push:
    branches: ['ios/swiftui']
    paths: ['ios/**', '.github/workflows/ios-simulator.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled engine
        run: |
          node ios/scripts/build-engine.mjs
          node ios/scripts/build-hp-digits.mjs
          git diff --exit-code -- ios/Resources/engine.bundle.js ios/FX991/HPDigits.swift
          node --test ios/tests/*.test.mjs
      - name: Build iOS simulator (no signing)
        run: xcodebuild -project ios/FX991.xcodeproj -scheme FX991 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Launch on an available iPhone simulator
        timeout-minutes: 8
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/FX991.app' -type d -print -quit)
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" dev.sagittaryuz.fx991lax --native-selftest
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" dev.sagittaryuz.fx991lax data)
          for attempt in {1..60}; do test -f "$CONTAINER/Documents/native-selftest.json" && break; sleep 1; done
          test -f "$CONTAINER/Documents/native-selftest.json"
          cat "$CONTAINER/Documents/native-selftest.json"
          python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["passed"] else 1)' "$CONTAINER/Documents/native-selftest.json"
          xcrun simctl terminate "$DEVICE" dev.sagittaryuz.fx991lax
          xcrun simctl launch "$DEVICE" dev.sagittaryuz.fx991lax
          xcrun simctl io "$DEVICE" screenshot /tmp/fx991-ios.png
      - name: Save simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: fx991-ios-simulator
          path: /tmp/fx991-ios.png
